name: Release

on:
  push:
    branches:
      - feature/gha-release
    tags:
      - "v*"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  
  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Check version matches tag
        run: |
          TAG=${{ github.ref_name }}
          echo "$TAG"
          exit 1
      - name: Node CI
        run: npm ci
      - name: Package Extension
        run: npx @vscode/vsce package
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          path: sl-vscode-edit-*.vsix
          retention-days: 30
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: test
          artifacts: sl-vscode-edit-*.vsix
      